name: item-bro

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-item-bro}
      DB_USER: ${DB_USER:-kriksson}
      DB_PASSWORD: ${DB_PASSWORD:-kriksson}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-item_bro}
      POSTGRES_USER: ${DB_USER:-kriksson}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kriksson}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
