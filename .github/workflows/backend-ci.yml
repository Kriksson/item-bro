name: Backend CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Print start check
        run: echo "Check started"
      - name: Set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Get java version
        run: java --version
      - name: Get docker info
        run: docker info
      - name: Start verify
        run: bash ./mvnw --batch-mode --no-transfer-progress verify -DfailIfNoTests=true
      - name: Test report
        uses: actions/upload-artifact@v7
        with:
          name: 'backend-test-report'
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: error
        if: always()
